[package]
name = "forge"
version = "0.0.1-beta1"
description = "Forge — a fast, local-first API client"
authors = ["you"]
edition = "2021"
license-file = "../LICENSE"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "rustls", "stream", "gzip", "brotli", "deflate", "charset", "http2", "system-proxy", "socks"] }
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.19"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
dirs = "6.0.0"
url = "2.5.8"
base64 = "0.23.0"
rhai = { version = "1.25.1", features = ["sync"] }
boa_engine = "0.21.1"
md-5 = "0.11.0"
sha2 = "0.11.0"
regex = "1.13.1"
serde_yaml = "0.9.34"
cookie = "0.18.1"
form_urlencoded = "1.2.2"
urlencoding = "2.1.3"

[dev-dependencies]
tempfile = "3.27.0"

